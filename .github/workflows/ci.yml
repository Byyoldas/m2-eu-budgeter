name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm test (erc-budget)
        run: pnpm --filter m2-eu-budgeter test

      # tauri::generate_context!() (invoked by erc-budget/src-tauri) requires
      # frontendDist ("../dist") to already exist, so the frontend must be
      # built before any cargo command touches the workspace.
      - name: pnpm build (erc-budget)
        run: pnpm --filter m2-eu-budgeter build

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: TypeScript bindings must match Rust structs (no uncommitted drift)
        run: |
          cargo test -p erc-core --features ts-rs
          git diff --exit-code -- erc-core/bindings || {
            echo "::error::erc-core/bindings/*.ts is out of date. Run 'cargo test -p erc-core --features ts-rs' locally and commit the result.";
            exit 1;
          }
